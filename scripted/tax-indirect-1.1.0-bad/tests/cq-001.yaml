id: CQ-001
question: "Which supplies need a place of supply in Quebec?"
fixtures: [fixtures/examples.ttl]
query: |
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX : <https://onto.melx.buzz/ns/tax/indirect#>
  PREFIX d: <https://onto.melx.buzz/ns/tax/indirect/data/>
  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
  SELECT DISTINCT ?supply
  WHERE {
    ?supply a/rdfs:subClassOf* :Supply ;
        :placeOfSupply <https://onto.melx.buzz/ns/legal/jurisdictions#CA-QC> .
  }
expect:
  rows: 3
  contains: [{"supply":"<https://onto.melx.buzz/ns/tax/indirect/data/DigitalSupply1>"},{"supply":"<https://onto.melx.buzz/ns/tax/indirect/data/MaplewoodSupply4>"},{"supply":"<https://onto.melx.buzz/ns/tax/indirect/data/MaplewoodSupply3>"}]
