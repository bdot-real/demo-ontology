id: CQ-002
question: "In which jurisdictions has Maplewood crossed a registration threshold?"
fixtures: [fixtures/examples.ttl]
query: |
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX : <https://onto.melx.buzz/ns/tax/indirect#>
  PREFIX d: <https://onto.melx.buzz/ns/tax/indirect/data/>
  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
  SELECT DISTINCT ?jurisdiction
  WHERE {
    ?threshold a :RegistrationThreshold ;
        :thresholdJurisdiction ?jurisdiction ;
        :amount ?thresholdAmount .
    ?supply a/rdfs:subClassOf* :Supply ;
        :placeOfSupply ?jurisdiction ;
        :amount ?supplyAmount .
    FILTER (?supplyAmount > ?thresholdAmount)
  }
expect:
  rows: 2
  contains: [{"jurisdiction":"<https://onto.melx.buzz/ns/legal/jurisdictions#US-WA>"},{"jurisdiction":"<https://onto.melx.buzz/ns/legal/jurisdictions#US-NY>"}]
